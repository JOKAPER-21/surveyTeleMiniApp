<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VID Survey Submission</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #222222);
    --hint: var(--tg-theme-hint-color, #999999);
    --button: var(--tg-theme-button-color, #2481cc);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
    --secondary-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  h2 { margin: 0 0 16px; font-size: 20px; }
  label {
    display: block;
    font-size: 13px;
    color: var(--hint);
    margin: 14px 0 4px;
  }
  input[type="text"],
  input[type="date"],
  input[type="time"] {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ddd;
    background: var(--secondary-bg);
    color: var(--text);
    font-size: 15px;
  }
  .file-drop {
    border: 2px dashed #ccc;
    border-radius: 10px;
    padding: 16px;
    text-align: center;
    margin-top: 6px;
    background: var(--secondary-bg);
    cursor: pointer;
  }
  #fileList {
    margin-top: 8px;
    font-size: 13px;
  }
  .file-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 8px;
    background: var(--secondary-bg);
    border-radius: 6px;
    margin-bottom: 4px;
  }
  .file-item button {
    border: none;
    background: none;
    color: #d33;
    font-size: 14px;
    cursor: pointer;
  }
  #submitBtn {
    width: 100%;
    margin-top: 22px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: var(--button);
    color: var(--button-text);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  #submitBtn:disabled { opacity: 0.6; }
  #status {
    margin-top: 14px;
    font-size: 13px;
    text-align: center;
    min-height: 18px;
  }
  .error { color: #d33; }
  .success { color: #2a2; }
</style>
</head>
<body>

<h2>Survey Submission</h2>

<form id="surveyForm">
  <label for="code">Code</label>
  <input type="text" id="code" required />

  <label for="name">Name</label>
  <input type="text" id="name" required />

  <label for="surveyor">DGPS Surveyor</label>
  <input type="text" id="surveyor" required />

  <label for="command">Command</label>
  <input type="text" id="command" required />

  <label for="date">Date</label>
  <input type="date" id="date" required />

  <label for="time">Time</label>
  <input type="time" id="time" required />

  <label>Files (.dwg, .dxf, .csv, .txt — up to 10)</label>
  <div class="file-drop" id="fileDrop">
    Tap to select files
    <input type="file" id="fileInput" multiple accept=".dwg,.dxf,.csv,.txt" style="display:none" />
  </div>
  <div id="fileList"></div>

  <button type="submit" id="submitBtn">Submit Survey</button>
  <div id="status"></div>
</form>

<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }

// Replace with your phone's local IP address running the Termux server,
// e.g. "http://192.168.1.42:5000/upload"
const API_URL = "http://127.0.0.1:5000/upload";

const MAX_FILES = 10;
const ALLOWED_EXT = [".dwg", ".dxf", ".csv", ".txt"];

let selectedFiles = [];

const fileDrop = document.getElementById("fileDrop");
const fileInput = document.getElementById("fileInput");
const fileListEl = document.getElementById("fileList");
const statusEl = document.getElementById("status");
const submitBtn = document.getElementById("submitBtn");

fileDrop.addEventListener("click", () => fileInput.click());

fileInput.addEventListener("change", () => {
  for (const file of fileInput.files) {
    const ext = "." + file.name.split(".").pop().toLowerCase();
    if (!ALLOWED_EXT.includes(ext)) {
      showStatus(`File type not allowed: ${file.name}`, true);
      continue;
    }
    if (selectedFiles.length >= MAX_FILES) {
      showStatus(`Maximum ${MAX_FILES} files allowed`, true);
      break;
    }
    selectedFiles.push(file);
  }
  fileInput.value = "";
  renderFileList();
});

function renderFileList() {
  fileListEl.innerHTML = "";
  selectedFiles.forEach((file, index) => {
    const row = document.createElement("div");
    row.className = "file-item";
    row.innerHTML = `<span>${file.name}</span>`;
    const removeBtn = document.createElement("button");
    removeBtn.textContent = "Remove";
    removeBtn.type = "button";
    removeBtn.onclick = () => {
      selectedFiles.splice(index, 1);
      renderFileList();
    };
    row.appendChild(removeBtn);
    fileListEl.appendChild(row);
  });
}

function showStatus(message, isError) {
  statusEl.textContent = message;
  statusEl.className = isError ? "error" : "success";
}

document.getElementById("surveyForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  submitBtn.disabled = true;
  showStatus("Submitting...", false);

  const formData = new FormData();
  formData.append("code", document.getElementById("code").value.trim());
  formData.append("name", document.getElementById("name").value.trim());
  formData.append("surveyor", document.getElementById("surveyor").value.trim());
  formData.append("command", document.getElementById("command").value.trim());
  formData.append("date", document.getElementById("date").value);
  formData.append("time", document.getElementById("time").value);

  selectedFiles.forEach((file) => {
    formData.append("files", file, file.name);
  });

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      body: formData,
    });
    const data = await response.json();

    if (data.ok) {
      showStatus("Survey sent successfully!", false);
      if (tg) tg.showAlert("Survey sent successfully!");
      document.getElementById("surveyForm").reset();
      selectedFiles = [];
      renderFileList();
    } else {
      showStatus(data.error || "Submission failed", true);
      if (tg) tg.showAlert(data.error || "Submission failed");
    }
  } catch (err) {
    showStatus("Network error: " + err.message, true);
    if (tg) tg.showAlert("Network error: " + err.message);
  } finally {
    submitBtn.disabled = false;
  }
});
</script>

</body>
</html>
